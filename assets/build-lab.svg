<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="320" viewBox="0 0 1040 320" role="img" aria-labelledby="title desc">
  <title id="title">JungHwan's Build Lab</title>
  <desc id="desc">불편함을 발견하면 직접 만드는 개발자의 작은 작업실. 컨베이어 위의 작은 문제들이 쓸모 있는 도구로 바뀝니다.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#223D42" opacity=".075"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="0" flood-color="#223D42" flood-opacity=".1"/>
    </filter>
    <clipPath id="canvas"><rect width="1040" height="320" rx="20"/></clipPath>
    <clipPath id="beltClip"><rect x="578" y="224" width="402" height="38" rx="19"/></clipPath>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .belt{animation:conveyor 3s linear infinite}
      .spark{animation:spark 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .lamp{animation:lamp 3s ease-in-out infinite}
      .eye{animation:blink 6s step-end infinite;transform-box:fill-box;transform-origin:center}
      .parcel{animation:parcel 3s ease-in-out infinite}
      @keyframes conveyor{to{transform:translateX(36px)}}
      @keyframes spark{0%,35%,85%,100%{opacity:.35;transform:scale(.75)}55%,70%{opacity:1;transform:scale(1)}}
      @keyframes lamp{0%,100%{opacity:.5}50%{opacity:1}}
      @keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}45%,47%{transform:scaleY(.12)}}
      @keyframes parcel{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @media(prefers-reduced-motion:reduce){.belt,.spark,.lamp,.eye,.parcel{animation:none}}
    </style>
  </defs>
  <g clip-path="url(#canvas)">
    <rect width="1040" height="320" fill="#F5F3EC"/>
    <rect width="1040" height="320" fill="url(#grid)"/>
    <path d="M535 0V320" stroke="#DADDD2"/>
    <path d="M0 286H535" stroke="#DADDD2"/>
    <rect x="28" y="26" width="9" height="9" rx="2" fill="#DF6B45"/>
    <text x="47" y="35" class="mono" font-size="11" font-weight="700" letter-spacing="2.1" fill="#244248">JUNGHWAN / BUILD LAB</text>
    <text x="28" y="103" font-size="46" font-weight="850" letter-spacing="-1.8" fill="#203E44">Small tools.</text>
    <text x="28" y="153" font-size="46" font-weight="850" letter-spacing="-1.8" fill="#203E44">Real solutions<tspan fill="#DF6B45">.</tspan></text>
    <text x="30" y="188" font-size="16" font-weight="500" fill="#5C6F6D">불편함을 발견하면, 직접 만듭니다.</text>
    <rect x="29" y="213" width="170" height="30" rx="15" fill="#203E44"/>
    <circle cx="46" cy="228" r="3.5" fill="#B8D796" class="lamp"/>
    <text x="58" y="232" class="mono" font-size="11" font-weight="600" fill="#FFFFFF">JAVA + SPRING</text>
    <text x="213" y="232" font-size="11.5" fill="#5C6F6D">WebSquare · eGovFrame</text>
    <text x="29" y="307" class="mono" font-size="10" letter-spacing=".8" fill="#6A7C75">LESS REPETITION. MORE BUILDING.</text>

    <rect x="567" y="25" width="163" height="24" rx="12" fill="#E7EBDF"/>
    <circle cx="582" cy="37" r="3" fill="#587B4D" class="lamp"/>
    <text x="593" y="41" class="mono" font-size="9" letter-spacing="1" fill="#426345">WORKSHOP IS OPEN</text>
    <text x="984" y="41" class="mono" font-size="10" text-anchor="end" fill="#7B8C83">EST. DAILY CURIOSITY</text>

    <path d="M614 274v11M948 274v11" stroke="#244248" stroke-width="5" stroke-linecap="round"/>
    <rect x="576" y="222" width="406" height="44" rx="22" fill="#DCE1D3" stroke="#244248" stroke-width="2"/>
    <g clip-path="url(#beltClip)" stroke="#B1BEAE" stroke-width="2">
      <g class="belt">
        <path d="M548 226l-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34m50-34-14 34"/>
      </g>
    </g>
    <circle cx="598" cy="244" r="9" fill="#F5F3EC" stroke="#244248" stroke-width="2"/>
    <circle cx="960" cy="244" r="9" fill="#F5F3EC" stroke="#244248" stroke-width="2"/>

    <g class="parcel">
      <rect x="604" y="168" width="66" height="53" rx="7" fill="#E9B59B" stroke="#244248" stroke-width="2"/>
      <path d="M624 169v52M649 169v52" stroke="#244248" stroke-width="1.5" opacity=".2"/>
      <text x="637" y="200" text-anchor="middle" class="mono" font-size="24" font-weight="700" fill="#244248">?</text>
    </g>
    <text x="637" y="151" text-anchor="middle" font-size="11" fill="#687C72">작은 불편함</text>
    <path d="M680 191h19m-5-5 6 5-6 5" fill="none" stroke="#8B9D8B" stroke-width="2" stroke-linecap="round"/>

    <g filter="url(#shadow)">
      <rect x="713" y="89" width="137" height="133" rx="16" fill="#244248"/>
      <rect x="725" y="101" width="113" height="81" rx="8" fill="#DDEBC8"/>
      <path d="M781 89V76" stroke="#244248" stroke-width="4"/>
      <circle cx="781" cy="69" r="7" fill="#DF6B45" stroke="#244248" stroke-width="2" class="lamp"/>
      <rect x="747" y="126" width="11" height="17" rx="4" fill="#244248" class="eye"/>
      <rect x="803" y="126" width="11" height="17" rx="4" fill="#244248" class="eye"/>
      <path d="M768 155q13 12 26 0" fill="none" stroke="#244248" stroke-width="3" stroke-linecap="round"/>
      <rect x="737" y="148" width="12" height="4" rx="2" fill="#DF6B45" opacity=".7"/>
      <rect x="812" y="148" width="12" height="4" rx="2" fill="#DF6B45" opacity=".7"/>
      <text x="781" y="206" text-anchor="middle" class="mono" font-size="11" font-weight="600" letter-spacing="2" fill="#EAF0DE">MAKE IT.</text>
      <rect x="705" y="126" width="8" height="42" rx="4" fill="#DF6B45"/>
      <rect x="850" y="126" width="8" height="42" rx="4" fill="#DF6B45"/>
    </g>
    <path d="m859 80 5-12 5 12 12 5-12 5-5 12-5-12-12-5z" fill="#DF6B45" class="spark"/>
    <path d="m879 116 3-7 3 7 7 3-7 3-3 7-3-7-7-3z" fill="#D4A84B" class="spark"/>

    <path d="M865 191h17m-5-5 6 5-6 5" fill="none" stroke="#8B9D8B" stroke-width="2" stroke-linecap="round"/>
    <g class="parcel" style="animation-delay:-1.5s">
      <rect x="895" y="165" width="65" height="56" rx="8" fill="#DDEBC8" stroke="#244248" stroke-width="2"/>
      <path d="M913 192l9 9 18-20" fill="none" stroke="#426345" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="928" y="151" text-anchor="middle" font-size="11" fill="#687C72">쓸모 있는 도구</text>
    <text x="781" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#5C6F6D">회의 기록 · 기억 정리 · 반복 작업 자동화</text>
  </g>
</svg>
